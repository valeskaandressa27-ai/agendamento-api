spring.application.name=agendamento-api

# Banco de dados em memoria (H2) - facil de rodar sem configurar nada
spring.datasource.url=jdbc:h2:mem:agendamentodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2 disponivel em /h2-console (usuario: sa, senha em branco)
spring.h2.console.enabled=true
